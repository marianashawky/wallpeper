name: football_wallpaper
description: Lumina — wallpapers for stills, motion, and video.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^5.3.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  image_gallery_saver_plus: ^4.0.0
  share_plus: ^10.1.4
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
