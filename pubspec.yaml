name: football_wallpaper
description: Football Wallpaper — cinematic football wallpapers. Fully offline.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^5.3.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  image_gallery_saver_plus: ^4.0.0
  share_plus: ^10.1.4
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/branding/
    - assets/images/categories/
    - assets/images/wallpapers/players/
    - assets/images/wallpapers/clubs/
    - assets/images/wallpapers/national_teams/
    - assets/images/wallpapers/legends/
    - assets/images/wallpapers/stadiums/
    - assets/images/wallpapers/3d/
